# Soford public website at https://stepnex.cn/soford/ (www.soford.cn reserved for Alibaba ICBU).
#
# Include inside the existing `listen 443 ssl` server block for stepnex.cn, before its `location /`:
#     sudo cp deploy/nginx/snippets/stepnex-soford-website.locations.conf /etc/nginx/snippets/
#     include /etc/nginx/snippets/stepnex-soford-website.locations.conf;
# then `sudo nginx -t && sudo systemctl reload nginx`.
#
# In the port-80 server block for stepnex.cn, redirect to HTTPS:
#     location = /soford  { return 308 https://stepnex.cn/soford/; }
#     location /soford/   { return 308 https://stepnex.cn$request_uri; }
#
# API env: Website__AllowedOrigins must include https://stepnex.cn (and www.stepnex.cn if used).
# Files live in /opt/soford-website/ (copy from SofordWebsite/).

location = /soford {
    return 308 /soford/;
}

# Product catalog is read from the ERP store (same path prefix as the static site).
location /soford/public/products {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:5153/public/products;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Company profile edited in the ERP (same path prefix as the static site).
location = /soford/public/site {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:5153/public/site;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

# Quote form posts here (same path prefix as the static site).
location = /soford/public/inquiries {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:5153/public/inquiries;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location /soford/ {
    alias /opt/soford-website/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location /soford/assets/ {
    alias /opt/soford-website/assets/;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
}
