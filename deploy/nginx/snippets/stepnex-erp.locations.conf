# Soford ERP fallback entry at https://stepnex.cn/erp/ (used while erp.soford.cn awaits ICP filing).
#
# Include inside the existing `listen 443 ssl` server block for stepnex.cn, before its `location /`:
#     sudo cp deploy/nginx/snippets/stepnex-erp.locations.conf /etc/nginx/snippets/
#     include /etc/nginx/snippets/stepnex-erp.locations.conf;
# then `sudo nginx -t && sudo systemctl reload nginx`. These exact prefixes do not alter the blog or other routes on that host.
#
# In the port-80 server block for stepnex.cn, redirect the ERP to HTTPS:
#     location = /erp  { return 308 https://stepnex.cn/erp/; }
#     location /erp/   { return 308 https://stepnex.cn$request_uri; }
#
# The API env must match this host: AllowedHosts includes stepnex.cn,
# Alibaba__OAuthCallbackUrl=https://stepnex.cn/erp/openapi/callback,
# Alibaba__OAuthSuccessRedirect=https://stepnex.cn/erp/ (see deploy/env/soford-api.env.example).
#
# Security note: the ERP shares the stepnex.cn origin with the other sites on this host, so the API's
# cross-site request guard cannot separate them. Move back to a dedicated (sub)domain as soon as possible.

location = /erp {
    return 308 /erp/;
}

location /erp/api/ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:5153/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location = /erp/openapi/callback {
    proxy_pass http://127.0.0.1:5153/openapi/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
}

location /erp/assets/ {
    alias /opt/soford-erp/web/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

location /erp/ {
    alias /opt/soford-erp/web/;
    index index.html;
    add_header Cache-Control "no-cache";
}
