# Public website (SofordWebsite/) at www.soford.cn. The quote form posts to /public/inquiries on the same origin,
# which is proxied to the ERP API. Configure Website:AllowedOrigins for the API's origin check.
#
#     sudo mkdir -p /opt/soford-website && sudo cp -r SofordWebsite/* /opt/soford-website/
#     sudo cp deploy/nginx/soford-website.https.conf /etc/nginx/sites-available/soford-website
#     sudo ln -s /etc/nginx/sites-available/soford-website /etc/nginx/sites-enabled/
#     sudo certbot certonly --webroot -w /var/www/html -d www.soford.cn -d soford.cn
#     sudo nginx -t && sudo systemctl reload nginx
#
# The API env must allow this host and origin: AllowedHosts includes www.soford.cn;soford.cn and
# Website__AllowedOrigins__0=https://www.soford.cn (see deploy/env/soford-api.env.example).

server {
    listen 80;
    server_name www.soford.cn soford.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.soford.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name soford.cn;
    ssl_certificate /etc/letsencrypt/live/www.soford.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.soford.cn/privkey.pem;
    return 301 https://www.soford.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.soford.cn;

    ssl_certificate /etc/letsencrypt/live/www.soford.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.soford.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache";

    root /opt/soford-website;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript text/css text/plain image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Only the inquiry endpoint is exposed; the ERP API itself stays on its own domain.
    location = /public/inquiries {
        limit_except POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:5153/public/inquiries;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
