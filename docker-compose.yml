services:
  api:
    build:
      context: ./SofordRepApi
    env_file:
      - .env
    volumes:
      - soford_api_data:/app/App_Data
    ports:
      # Loopback only: the API trusts X-Forwarded-* headers, so it must sit behind the web proxy.
      - "127.0.0.1:5153:8080"

  web:
    build:
      context: ./WebSofordRep
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  soford_api_data:
